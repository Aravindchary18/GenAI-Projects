version: "3.9"

services:
  backend:
      build:
        context: ./backend
        dockerfile: Dockerfile
      
      container_name: genai_backend

      ports:
        - "8000:8000"
      env_file:
        - .env

      volumes:
        - ./backend/cache.db:/app/cache.db
      depends_on:

        - qdrant

        - ollama

      healthcheck:
        test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/', timeout=3)"]
        interval: 10s
        timeout: 5s 
        retries: 10
        start_period: 500s
     
        
   
  frontend:
      build:
        context: ./frontend
        dockerfile: Dockerfile

      container_name: genai_frontend

      ports:
        - "8501:8501"
      environment:
        FASTAPI_URL: http://backend:8000

      depends_on:
        - backend
    

  qdrant:
      image: qdrant/qdrant

      container_name: qdrant

      ports:
        - "6333:6333"

      volumes:
        - qdrant_data:/qdrant/storage

  ollama:
      image: ollama/ollama

      container_name: ollama

      ports:
        - "11434:11434"

      volumes:
        - ollama_data:/root/.ollama

volumes:
      
      qdrant_data:

      ollama_data:
       

    